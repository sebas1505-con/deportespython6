{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto — {{ producto.nombre }}</title>
    <link rel="stylesheet" href="{% static 'css/editar_producto.css' %}">
</head>
<body>

<div class="container">

    <h2>Editar Producto</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Nombre del producto</label>
        <input type="text" name="nombre" value="{{ producto.nombre }}" required>

        <label>Precio</label>
        <input type="number" name="precio" value="{{ producto.precio|floatformat:0 }}"
               min="1" max="9999999" step="1" required
               oninput="if(this.value.length>7) this.value=this.value.slice(0,7);"
               style="width:100%;">
        <small id="precio-err" style="color:#d40000;display:none;font-size:12px;">El precio no puede superar $9.999.999</small>

        <label>Descripción</label>
        <textarea name="descripcion">{{ producto.descripcion }}</textarea>

        <label>Categoría</label>
        <select name="categoria">
            <option value="">Seleccionar</option>
            <option value="HOMBRE" {% if producto.categoria == 'HOMBRE' %}selected{% endif %}>Hombre</option>
            <option value="MUJER"  {% if producto.categoria == 'MUJER'  %}selected{% endif %}>Mujer</option>
            <option value="MIXTO"  {% if producto.categoria == 'MIXTO'  %}selected{% endif %}>Mixto</option>
        </select>

        {% if producto.imagen %}
        <label>Imagen actual</label>
        <img src="{{ producto.imagen.url }}" width="120" alt="{{ producto.nombre }}">
        {% endif %}

        <label>Cambiar imagen (opcional)</label>
        <input type="file" name="imagen" accept="image/*">

        <button type="submit" onclick="return validarPrecio()">Actualizar Producto</button>
        <a href="{% url 'productos' %}" style="display:block;text-align:center;margin-top:10px;color:#666;font-size:14px;">← Volver</a>
    </form>

</div>

<script>
function validarPrecio(){
  var input = document.querySelector('[name="precio"]');
  var err   = document.getElementById('precio-err');
  var val   = parseInt(input.value, 10);
  if(isNaN(val) || val < 1){
    err.textContent = 'El precio debe ser mayor a $0.';
    err.style.display = 'block'; input.focus(); return false;
  }
  if(val > 9999999){
    err.textContent = 'El precio no puede superar $9.999.999';
    err.style.display = 'block'; input.focus(); return false;
  }
  err.style.display = 'none';
  return true;
}
</script>
</body>
</html>
