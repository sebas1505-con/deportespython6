{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto — {{ producto.nombre }}</title>
    <link rel="stylesheet" href="{% static 'css/editar_producto.css' %}">
</head>
<body>

<div class="container">

    <h2>Editar Producto</h2>

    {% if messages %}{% for message in messages %}
    <p style="background:{% if 'error' in message.tags %}#fee2e2{% else %}#dcfce7{% endif %};
              color:{% if 'error' in message.tags %}#b91c1c{% else %}#15803d{% endif %};
              padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:14px;">
      {{ message }}</p>
    {% endfor %}{% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Nombre del producto</label>
        <input type="text" name="nombre" value="{{ producto.nombre }}" required>

        <label>Precio</label>
        <input type="number" name="precio" id="inp-precio-edit" value="{{ producto.precio|floatformat:0 }}"
               min="1000" max="9999999" step="1" required
               oninput="validarPrecioEdit(this)"
               style="width:100%;">
        <small id="precio-err" style="color:#d40000;display:none;font-size:12px;margin-top:4px;"></small>

        <label>Descripción</label>
        <textarea name="descripcion">{{ producto.descripcion }}</textarea>

        <label>Categoría</label>
        <select name="categoria">
            <option value="">Seleccionar</option>
            <option value="HOMBRE" {% if producto.categoria == 'HOMBRE' %}selected{% endif %}>Hombre</option>
            <option value="MUJER"  {% if producto.categoria == 'MUJER'  %}selected{% endif %}>Mujer</option>
            <option value="MIXTO"  {% if producto.categoria == 'MIXTO'  %}selected{% endif %}>Mixto</option>
        </select>

        {% if producto.imagen %}
        <label>Imagen actual</label>
        <img src="{{ producto.imagen.url }}" width="120" alt="{{ producto.nombre }}">
        {% endif %}

        <label>Cambiar imagen (opcional)</label>
        <input type="file" name="imagen" accept="image/*">

        <button type="submit" onclick="return validarPrecioEdit(document.getElementById('inp-precio-edit'))">Actualizar Producto</button>
        <a href="{% url 'productos' %}" style="display:block;text-align:center;margin-top:10px;color:#666;font-size:14px;">← Volver</a>
    </form>

</div>

<script>
function validarPrecioEdit(inp) {
    var err = document.getElementById('precio-err');
    var v   = parseFloat(inp.value);
    if (!inp.value || isNaN(v)) { err.style.display = 'none'; return true; }
    if (v < 1000) {
        err.textContent = 'El precio mínimo es $1.000. Ejemplo válido: 45000';
        err.style.display = 'block'; inp.style.borderColor = '#d40000'; inp.focus(); return false;
    }
    if (v > 9999999) {
        err.textContent = 'El precio no puede superar $9.999.999. Verifica los dígitos.';
        err.style.display = 'block'; inp.style.borderColor = '#d40000'; inp.focus(); return false;
    }
    err.style.display = 'none'; inp.style.borderColor = '#16a34a'; return true;
}
</script>
</body>
</html>
