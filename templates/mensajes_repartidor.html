{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes — Deportes 360</title>
  <link rel="icon" type="image/png" href="{% static 'images/repar.png' %}">
  <link rel="stylesheet" href="{% static 'css/repartidor.css' %}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    html, body { height: 100%; background: #f2f3f5; color: #222; }

    /* ── HEADER igual al repartidor ── */
    .header {
      background: linear-gradient(90deg, #0d1a26, #1a2f45);
      color: #fff;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid #d40000;
    }
    .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }

    /* ── NAV HAMBURGER ── */
    #nav-toggle { display: none; }
    .nav-toggle-btn { display: none; }
    .nav-rep { display: flex; gap: 10px; }

    @media (max-width: 600px) {
      .header { position: relative; flex-wrap: wrap; }
      .nav-toggle-btn {
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        gap: 5px; width: 38px; height: 34px;
        background: rgba(255,255,255,0.12); border-radius: 8px; cursor: pointer;
      }
      .nav-toggle-btn span { display: block; width: 20px; height: 2px; background: #fff; border-radius: 2px; transition: 0.3s ease; }
      #nav-toggle:checked + .nav-toggle-btn span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
      #nav-toggle:checked + .nav-toggle-btn span:nth-child(2) { opacity: 0; }
      #nav-toggle:checked + .nav-toggle-btn span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
      .nav-rep { display: none; flex-direction: column; width: 100%; gap: 8px; padding: 12px 0 4px; }
      #nav-toggle:checked ~ .nav-rep { display: flex; }
    }

    .btn {
      display: inline-block; padding: 8px 18px;
      background: #0d1a26; color: #fff; border: none;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: 0.2s;
    }
    .btn:hover { background: #1a2f45; }
    .btn-active { background: #d40000 !important; }
    .btn-logout { background: #d40000; }
    .btn-logout:hover { background: #8b0000; }

    /* ── ÁREA DE MENSAJES ── */
    .chat-body {
      position: fixed;
      top: 68px; bottom: 70px;
      left: 0; right: 0;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #eef1f5;
    }

    .msg-group-fecha {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #888;
      background: rgba(255,255,255,.7);
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      align-self: center;
      margin: 8px 0 4px;
    }

    .msg-row { display: flex; flex-direction: column; }
    .msg-row.admin { align-items: flex-start; }
    .msg-row.yo    { align-items: flex-end; }

    .msg-lbl {
      font-size: 10px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      position: relative;
    }
    .msg-bubble.admin {
      background: #fff;
      color: #111;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .msg-bubble.yo {
      background: #0d1a26;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-hora {
      display: block;
      font-size: 10px;
      opacity: .55;
      margin-top: 5px;
      text-align: right;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #aaa;
      padding-bottom: 40px;
    }
    .chat-empty-icon { font-size: 52px; }
    .chat-empty p { font-size: 14px; }

    /* ── INPUT ── */
    .chat-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
    }

    .chat-footer input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      background: #f7f8fa;
      transition: border-color .2s;
    }
    .chat-footer input:focus { border-color: #0d1a26; background: #fff; }

    .chat-footer button {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #0d1a26;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .2s;
    }
    .chat-footer button:hover { background: #d40000; }
    .chat-footer button svg { width: 20px; height: 20px; fill: #fff; }

    @media (max-width: 600px) {
      .msg-bubble { max-width: 88%; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>Mensajes</h1>
  <input type="checkbox" id="nav-toggle" />
  <label for="nav-toggle" class="nav-toggle-btn" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </label>
  <nav class="nav-rep">
    <a href="{% url 'repartidor' %}" class="btn">Inicio</a>
    <a href="{% url 'perfil_repartidor' %}" class="btn">Mi Perfil</a>
    <a href="{% url 'mensajes_repartidor' %}" class="btn btn-active">Mensajes</a>
    <a href="{% url 'logout' %}" class="btn btn-logout">Cerrar Sesión</a>
  </nav>
</div>

<!-- MENSAJES -->
<div class="chat-body" id="chat-body">
  <div class="chat-empty" id="chat-empty">
    <div class="chat-empty-icon">💬</div>
    <p>Aún no hay mensajes. ¡Escribe el primero!</p>
  </div>
</div>

<!-- INPUT -->
<div class="chat-footer">
  <input type="text" id="msg-input" placeholder="Escribe un mensaje…" autocomplete="off">
  <button onclick="enviarMsg()" title="Enviar">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
var _rendered = 0;

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cargarMensajes() {
  fetch('/mensajes/inbox/')
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (!data.ok) return;
    var msgs = data.mensajes;
    if (msgs.length === 0) return;

    var body = document.getElementById('chat-body');
    var empty = document.getElementById('chat-empty');
    if (empty) { empty.remove(); }

    var nuevos = msgs.slice(_rendered);
    nuevos.forEach(function(m){
      var row = document.createElement('div');
      row.className = 'msg-row ' + (m.es_admin ? 'admin' : 'yo');

      var lbl = document.createElement('div');
      lbl.className = 'msg-lbl';
      lbl.textContent = m.es_admin ? 'Admin' : 'Tú';

      var burbuja = document.createElement('div');
      burbuja.className = 'msg-bubble ' + (m.es_admin ? 'admin' : 'yo');
      burbuja.innerHTML = escHtml(m.mensaje) + '<span class="msg-hora">' + m.hora + '</span>';

      row.appendChild(lbl);
      row.appendChild(burbuja);
      body.appendChild(row);
    });

    _rendered = msgs.length;
    body.scrollTop = body.scrollHeight;
  })
  .catch(function(){});
}

function enviarMsg() {
  var input = document.getElementById('msg-input');
  var texto = input.value.trim();
  if (!texto) return;
  var fd = new FormData();
  fd.append('mensaje', texto);
  fd.append('csrfmiddlewaretoken', '{{ csrf_token }}');
  input.value = '';
  fetch('/mensajes/inbox/', { method: 'POST', body: fd })
  .then(function(r){ return r.json(); })
  .then(function(data){ if (data.ok) cargarMensajes(); })
  .catch(function(){});
}

document.getElementById('msg-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); enviarMsg(); }
});

cargarMensajes();
setInterval(cargarMensajes, 4000);
</script>
</body>
</html>
